name: Auto Generate SEO Tools & Presets

on:
  schedule:
    # Runs automatically every 5 days at 00:00 UTC
    - cron: '0 0 */5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Search-Optimized Programmatic Tools
        run: |
          node scripts/generateTools.mjs

      - name: Commit and Push Updates
        run: |
          git config --global user.name "mantupatra23-pixel"
          git config --global user.email "mantupatra23-pixel@users.noreply.github.com"
          git add lib/autoGeneratedTools.json
          if git diff --staged --quiet; then
            echo "Tool registry is already up to date."
          else
            git commit -m "chore(auto): update programmatic tools matrix for search intent"
            git push origin main
          fi
