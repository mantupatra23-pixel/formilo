name: Auto Generate SEO Tools & Presets

on:
  schedule:
    # Runs every Monday at 05:00 UTC (10:30 AM IST)
    - cron: '0 5 * * 1'
  workflow_dispatch: # Manual Run button in GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-sync-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Programmatic Tools
        run: node scripts/generateTools.mjs

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/autoGeneratedTools.json

          if git diff --staged --quiet; then
            echo "No changes detected. Tool registry is up to date."
          else
            git commit -m "chore(auto): update programmatic tool registry via GitHub Action"
            git push origin main
          fi
